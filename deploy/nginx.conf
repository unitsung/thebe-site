# Nginx configuration for thebe.cc
# Serves composed static release artifact with atomic symlink deployment

server {
    listen 80;
    listen [::]:80;
    server_name thebe.cc www.thebe.cc;
    return 301 https://thebe.cc$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.thebe.cc;

    ssl_certificate /etc/letsencrypt/live/thebe.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thebe.cc/privkey.pem;

    return 301 https://thebe.cc$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thebe.cc;

    root /var/www/thebe.cc/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/thebe.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thebe.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Charset
    charset utf-8;

    # Clean URL routing contract
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Immutable hashed static assets
    location ~* ^/(?:_astro|assets)/.*\.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML pages should revalidate
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # XML sitemaps
    location ~* \.xml$ {
        expires 1d;
        add_header Content-Type "application/xml; charset=utf-8";
    }

    # Error page contract: real 404 HTTP status with styled fallback page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
